<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat | Sekolah Pemilu dan Demokrasi KPU Buton Selatan</title>
    <link rel="icon" href="assets/Logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: { brand: { red: '#D91C1F', dark: '#0a0a0a', gray: '#1a1a1a' } }
                }
            }
        }
    </script>

    <style>
        .soft-bg {
            background-color: #2b2b31;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(217, 28, 31, 0.35) 0%, rgba(43, 43, 49, 0) 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.06) 0%, rgba(43, 43, 49, 0) 45%);
            background-attachment: fixed;
        }

        .form-panel {
            border-radius: 18px; padding: 20px;
            background: linear-gradient(180deg, rgba(217,28,31,0.22) 0%, rgba(140,18,22,0.16) 100%);
            border: 1px solid rgba(255,140,140,0.25);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        @media (min-width: 640px) { .form-panel { padding: 28px; } }

        .field-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #f3f4f6; }
        .field-hint  { margin-top: 5px; font-size: 12px; color: #d1d5db; }
        .field-error { margin-top: 5px; font-size: 12px; font-weight: 600; color: #fecaca; }

        .input {
            width: 100%; border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #fff;
            background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.22);
            transition: border-color .2s ease, background .2s ease;
        }
        .input::placeholder { color: #9ca3af; }
        .input:focus { outline: none; border-color: #fff; background: rgba(0,0,0,0.38); box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
        .input[aria-invalid="true"] { border-color: #f87171; }
        textarea.input { resize: vertical; min-height: 150px; line-height: 1.5; }

        .btn { transition: background .2s ease, transform .2s ease; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:disabled { opacity: .65; cursor: wait; }
        .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        /* Soal */
        .part-title { margin: 28px 0 4px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; font-size: 15px; color: #fca5a5; }
        .sub-title { margin: 20px 0 2px; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #d1d5db; }
        .q-card {
            margin-top: 12px; padding: 16px; border-radius: 16px;
            background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.14);
        }
        .q-card[aria-invalid="true"] { border-color: #f87171; }
        .q-text { font-weight: 700; font-size: 15px; line-height: 1.5; }
        .opt {
            display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
            margin-top: 8px; padding: 10px 12px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.18);
            transition: background .15s ease, border-color .15s ease;
        }
        .opt:hover { background: rgba(255,255,255,0.10); }
        .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .opt-key {
            flex: none; width: 26px; height: 26px; border-radius: 8px; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.14);
        }
        .opt-text { font-size: 14px; line-height: 1.5; padding-top: 2px; }
        .opt:has(input:checked) { background: rgba(217,28,31,0.55); border-color: #fff; }
        .opt:has(input:checked) .opt-key { background: #fff; color: #D91C1F; }
        .opt:has(input:focus-visible) { outline: 3px solid #fff; outline-offset: 2px; }

        .timer-bar {
            position: sticky; top: 0; z-index: 30; margin: 0 -4px 16px; padding: 10px 16px; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: rgba(30,30,36,0.92); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.2);
        }
        .timer-num { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
        .timer-bar.warn .timer-num { color: #f87171; }

        @media (prefers-reduced-motion: reduce) { .btn:hover:not(:disabled) { transform: none; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>

<body class="soft-bg text-white font-sans antialiased min-h-screen flex flex-col selection:bg-brand-red selection:text-white">

    <div class="w-full h-1.5 bg-gradient-to-r from-transparent via-brand-red to-transparent"></div>

    <!-- Header -->
    <header class="w-full border-b border-white/10 bg-white/5 backdrop-blur">
        <div class="px-6 md:px-12">
            <div class="max-w-[760px] mx-auto py-3 flex items-center gap-3 md:gap-4">
                <a href="https://www.kpu.go.id" target="_blank" rel="noopener" class="shrink-0">
                    <img src="https://www.kpu.go.id/images/1627539868logo-kpu.png" alt="Logo KPU"
                         class="h-10 md:h-14 w-auto object-contain">
                </a>
                <span class="h-8 md:h-10 w-px bg-white/25"></span>
                <a href="index.html" class="shrink-0">
                    <img src="assets/Logo.png" alt="Logo Sekolah Pemilu dan Demokrasi"
                         class="h-10 md:h-14 w-auto object-contain">
                </a>
                <p class="ml-1 text-[11px] md:text-xs font-semibold leading-tight text-gray-200">
                    Sekolah Pemilu &amp; Demokrasi<br>
                    <span class="text-red-400 font-black">KPU Buton Selatan</span>
                </p>
            </div>
        </div>
    </header>

    <!-- Konten -->
    <main class="flex-1 w-full px-6 md:px-12 pt-9 md:pt-12 pb-12">
        <div class="max-w-[760px] mx-auto">

            <div class="text-center">
                <h1 class="font-black uppercase tracking-tight text-2xl sm:text-3xl md:text-4xl">Sertifikat</h1>
                <p class="mt-2 text-sm text-gray-300">Sekolah Pemilu dan Demokrasi 2026 &middot; KPU Kabupaten Buton Selatan</p>
            </div>

            <!-- Input e-mail -->
            <form id="form-email" class="form-panel mt-7" novalidate>
                <label for="email" class="field-label">E-mail yang digunakan saat mendaftar</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input class="input flex-1" type="email" id="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
                    <button type="submit" id="btn-lihat" class="btn rounded-xl bg-brand-red hover:bg-red-600 border border-red-300/40 px-6 py-3 text-sm font-extrabold uppercase tracking-wide whitespace-nowrap">Lihat Sertifikat</button>
                </div>
            </form>

            <!-- Sertifikat -->
            <section id="hasil" class="hidden mt-7" aria-label="Sertifikat">
                <div class="rounded-2xl overflow-hidden border border-white/20 bg-white shadow-xl">
                    <canvas id="kanvas" class="block w-full h-auto"></canvas>
                </div>
                <div class="mt-4 flex flex-col sm:flex-row gap-3">
                    <button type="button" id="btn-png" class="btn sm:flex-1 rounded-2xl bg-brand-red hover:bg-red-600 border border-red-300/40 px-6 py-3.5 text-sm font-extrabold uppercase tracking-wide">Unduh PNG</button>
                    <button type="button" id="btn-pdf" class="btn sm:flex-1 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/25 px-6 py-3.5 text-sm font-bold uppercase tracking-wide text-gray-100">Unduh PDF</button>
                </div>
            </section>

        </div>
    </main>

    <!-- Pop up pemberitahuan -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 px-6" role="alertdialog" aria-modal="true" aria-labelledby="modal-judul" aria-describedby="modal-isi">
        <div class="w-full max-w-[380px] rounded-2xl border border-red-300/40 bg-[#2b2b31] p-6 text-center shadow-2xl">
            <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-brand-red" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>
            </span>
            <h2 id="modal-judul" class="mt-3 text-lg font-black uppercase"></h2>
            <p id="modal-isi" class="mt-1 text-sm text-gray-200"></p>
            <button type="button" id="modal-ok" class="btn mt-5 w-full rounded-xl bg-brand-red hover:bg-red-600 border border-red-300/40 px-6 py-3 text-sm font-extrabold uppercase tracking-wide">OK</button>
        </div>
    </div>

    <footer class="text-center text-[11px] text-gray-400 pb-5">
        &copy; 2026 KPU Kabupaten Buton Selatan
    </footer>

    <script>
        (function () {
            var ENDPOINT = 'https://script.google.com/macros/s/AKfycbw9NaeoKLLeBGTgN88Spt5InjOSeUrPYuqdC_xbByw36RJxklDpbFEh7PcnFoq1EeEHfA/exec';

            // ===== Pengaturan template sertifikat (sesuaikan setelah template diunggah) =====
            var TEMPLATE = 'assets/sertifikat.jpeg'; // gambar template di folder assets
            var NAMA = {
                x: 0.5,          // posisi tengah nama, sebagai pecahan lebar gambar (0 = kiri, 1 = kanan)
                y: 0.419,        // posisi garis dasar nama, sebagai pecahan tinggi gambar (0 = atas, 1 = bawah)
                ukuran: 0.042,   // tinggi huruf, sebagai pecahan lebar gambar
                lebarMaks: 0.32, // lebar maksimum nama (sebatas garis nama); nama panjang otomatis diperkecil
                warna: '#742414', // coklat kemerahan, diambil dari contoh nama
                font: '400 {px}px "Kaushan Script", cursive' // huruf tulisan tangan kuas
            };
            // ================================================================================

            var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
            function $(id) { return document.getElementById(id); }

            function kirim(payload) {
                return fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
            }

            function popup(judul, isi, fokusEmail) {
                $('modal-judul').textContent = judul;
                $('modal-isi').textContent = isi;
                $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
                $('modal-ok').focus();
                $('modal-ok').onclick = tutup;
                function tutup() {
                    $('modal').classList.add('hidden'); $('modal').classList.remove('flex');
                    document.removeEventListener('keydown', esc);
                    if (fokusEmail) $('email').focus();
                }
                function esc(e) { if (e.key === 'Escape') tutup(); }
                document.addEventListener('keydown', esc);
            }

            // Nama yang seluruhnya huruf besar atau seluruhnya huruf kecil dirapikan menjadi huruf awal kapital
            function rapikanNama(n) {
                n = String(n || '').replace(/\s+/g, ' ').trim();
                if (n !== n.toUpperCase() && n !== n.toLowerCase()) return n;
                return n.toLowerCase().replace(/(^|[\s.'\-])([a-z\u00e0-\u024f])/g, function (m, a, b) { return a + b.toUpperCase(); });
            }

            var gambarTemplate = null;
            function muatTemplate() {
                if (gambarTemplate) return Promise.resolve(gambarTemplate);
                return new Promise(function (ok, gagal) {
                    var im = new Image();
                    im.onload = function () { gambarTemplate = im; ok(im); };
                    im.onerror = function () { gagal(new Error('template')); };
                    im.src = TEMPLATE;
                });
            }

            function gambar(nama) {
                var fontMuat = document.fonts && document.fonts.load ? document.fonts.load(NAMA.font.replace('{px}', 40)) : Promise.resolve();
                return Promise.all([muatTemplate(), fontMuat.catch(function () {})]).then(function (r) {
                    var im = r[0], c = $('kanvas'), ctx = c.getContext('2d');
                    c.width = im.naturalWidth; c.height = im.naturalHeight;
                    ctx.drawImage(im, 0, 0);

                    var px = Math.round(c.width * NAMA.ukuran);
                    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = NAMA.warna;
                    ctx.font = NAMA.font.replace('{px}', px);
                    var lebar = ctx.measureText(nama).width, maks = c.width * NAMA.lebarMaks;
                    if (lebar > maks) { px = Math.floor(px * maks / lebar); ctx.font = NAMA.font.replace('{px}', px); }
                    ctx.fillText(nama, c.width * NAMA.x, c.height * NAMA.y);
                });
            }

            var namaFile = 'Sertifikat';
            function simpanNama(n) { namaFile = 'Sertifikat-' + n.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_'); }

            $('btn-png').addEventListener('click', function () {
                var a = document.createElement('a');
                a.href = $('kanvas').toDataURL('image/png'); a.download = namaFile + '.png';
                document.body.appendChild(a); a.click(); a.remove();
            });
            $('btn-pdf').addEventListener('click', function () {
                if (!window.jspdf) { popup('Pemberitahuan', 'Fitur PDF belum siap. Periksa koneksi internet lalu coba lagi, atau unduh dalam format PNG.', false); return; }
                var c = $('kanvas');
                var pdf = new window.jspdf.jsPDF({ orientation: c.width >= c.height ? 'l' : 'p', unit: 'px', format: [c.width, c.height], hotfixes: ['px_scaling'] });
                pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, c.width, c.height);
                pdf.save(namaFile + '.pdf');
            });

            var sibuk = false;
            $('email').addEventListener('input', function () { $('email').removeAttribute('aria-invalid'); });
            $('form-email').addEventListener('submit', function (e) {
                e.preventDefault();
                if (sibuk) return;
                var email = $('email').value.trim(), btn = $('btn-lihat');
                if (!EMAIL_RE.test(email)) { $('email').setAttribute('aria-invalid', 'true'); popup('E-mail salah', 'Isi e-mail yang valid.', true); return; }

                sibuk = true; btn.disabled = true; btn.textContent = 'Memeriksa...';
                $('hasil').classList.add('hidden');
                kirim({ aksi: 'sertifikat', email: email })
                    .then(function (res) {
                        if (!res.ok) {
                            if (res.salahEmail) $('email').setAttribute('aria-invalid', 'true');
                            popup(res.salahEmail ? 'E-mail salah' : 'Pemberitahuan', res.message || 'Sertifikat tidak tersedia.', !!res.salahEmail);
                            return;
                        }
                        var nama = rapikanNama(res.nama);
                        return gambar(nama).then(function () {
                            simpanNama(nama);
                            $('hasil').classList.remove('hidden');
                            $('hasil').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, function () {
                            popup('Pemberitahuan', 'Template sertifikat belum tersedia. Coba lagi nanti.', false);
                        });
                    })
                    .catch(function () { popup('Pemberitahuan', 'Gagal terhubung. Periksa koneksi internet lalu coba lagi.', false); })
                    .then(function () { sibuk = false; btn.disabled = false; btn.textContent = 'Lihat Sertifikat'; });
            });
        })();
    </script>
</body>
</html>
