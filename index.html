<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Sekolah Pemilu dan Demokrasi 2026</title>
    
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat Google Fonts (Montserrat untuk kesan elegan, kuat, dan modern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#D91C1F', 
                            dark: '#0a0a0a', 
                            gray: '#1a1a1a'  
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { textShadow: '0 0 10px rgba(217,28,31,0.5), 0 0 20px rgba(217,28,31,0.3)' },
                            '100%': { textShadow: '0 0 20px rgba(217,28,31,0.8), 0 0 40px rgba(217,28,31,0.5)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glow-bg {
            background: radial-gradient(circle at 50% 30%, rgba(217, 28, 31, 0.15) 0%, rgba(10, 10, 10, 1) 50%);
        }
        
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* Ukuran font dinamis yang aman dari posisi mentok */
        .text-title { font-size: clamp(11px, 3.5vw, 38px); }
        .text-subtitle { font-size: clamp(13px, 4.4vw, 40px); }
        .text-slogan { font-size: clamp(8px, 2vw, 14px); }
        
        /* Ukuran coming soon disesuaikan agar pas di layar kecil tanpa terlalu lebar */
        .text-coming { font-size: clamp(22px, 7.5vw, 96px); }
        .text-soon { font-size: clamp(22px, 7.5vw, 96px); }

        /* ===== Animasi tambahan ===== */
        /* Muncul dari bawah secara berurutan saat halaman dibuka */
        .reveal {
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo melayang pelan */
        .float-soft { animation: floatSoft 5s ease-in-out infinite; }
        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        /* Kilau tipis yang lewat di garis pemisah */
        .shimmer-line {
            background-size: 200% 100%;
            animation: shimmer 3.5s linear infinite;
        }
        @keyframes shimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }

        /* Hormati pengguna yang menonaktifkan animasi */
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; opacity: 1; }
            .float-soft, .shimmer-line { animation: none; }
        }
    </style>
</head>

<body class="bg-brand-dark text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center glow-bg relative overflow-hidden selection:bg-brand-red selection:text-white">

    <!-- Ornamen dekoratif latar belakang -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-brand-red to-transparent"></div>
    <div class="absolute -top-32 -left-32 w-64 h-64 bg-brand-red rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse-slow"></div>
    <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-white rounded-full mix-blend-screen filter blur-[100px] opacity-10 animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- Container Utama (mobile: naik lebih tinggi dengan -mt-28) -->
    <main class="relative z-10 flex flex-col items-center justify-center w-full max-w-5xl px-6 md:px-12 mx-auto text-center h-full -mt-28 md:-mt-24 pb-20 md:pb-0">
        <br><br><br><br>
        <!-- Bagian Logo (jarak ke judul diperbesar: mb-10 / md:mb-16) -->
        <div class="reveal mb-10 md:mb-16" style="animation-delay: 0.1s;">
            <div class="float-soft drop-shadow-[0_10px_20px_rgba(217,28,31,0.3)] transform hover:scale-105 transition-transform duration-500">
                <img src="assets/Logo.png" alt="Logo Sekolah Pemilu dan Demokrasi" class="mx-auto h-auto object-contain w-24 sm:w-28 md:w-36 lg:w-44">
            </div>
        </div>

        <!-- Judul Acara -->
        <div class="reveal mb-2 w-full flex flex-col items-center justify-center" style="animation-delay: 0.3s;">
            <h1 class="text-title font-black tracking-tight uppercase whitespace-nowrap">
                Sekolah Pemilu & Demokrasi
            </h1>
            <h1 class="text-subtitle font-black tracking-tight uppercase whitespace-nowrap text-transparent bg-clip-text bg-gradient-to-r from-brand-red to-red-400 mt-1">
                Buton Selatan 2026
            </h1>
        </div>

        <!-- Subjudul / Slogan -->
        <div class="reveal w-full flex items-center justify-center mt-2 mb-6" style="animation-delay: 0.5s;">
            <p class="text-slogan font-semibold tracking-[0.2em] md:tracking-[0.3em] text-gray-300 uppercase whitespace-nowrap">
                Belajar <span class="text-brand-red mx-1 md:mx-2">•</span> 
                Memahami <span class="text-brand-red mx-1 md:mx-2">•</span> 
                Berpartisipasi
            </p>
        </div>

        <!-- Teks Coming Soon Besar (Dioptimalkan agar mengecil secara aman) -->
        <div class="reveal w-full flex flex-row items-center justify-center gap-2 md:gap-6 my-3 md:my-8 whitespace-nowrap" style="animation-delay: 0.7s;">
            <h2 class="text-coming font-black tracking-widest italic animate-glow transform -skew-x-6">
                <span class="text-transparent bg-clip-text bg-gradient-to-br from-white via-gray-200 to-gray-500">COMING</span>
            </h2>
            <h2 class="text-soon font-black tracking-widest italic animate-glow transform -skew-x-6">
                <span class="text-transparent bg-clip-text bg-gradient-to-br from-brand-red via-red-600 to-red-900 drop-shadow-[0_0_10px_rgba(217,28,31,0.5)]">SOON</span>
            </h2>
        </div>

        <!-- Pesan Stay Tuned -->
        <div class="reveal w-full flex flex-col items-center justify-center mt-3" style="animation-delay: 0.9s;">
            <div class="shimmer-line h-px w-24 md:w-32 bg-gradient-to-r from-transparent via-brand-red to-transparent mb-4 opacity-70"></div>
            <p class="text-xs md:text-base lg:text-lg font-medium tracking-[0.1em] md:tracking-[0.15em] text-gray-300 uppercase whitespace-nowrap">
                Stay tuned on 
                <span class="text-brand-red font-black ml-1 md:ml-2 drop-shadow-[0_0_8px_rgba(217,28,31,0.5)]">October 2026</span>
            </p>
            <div class="shimmer-line h-px w-24 md:w-32 bg-gradient-to-r from-transparent via-brand-red to-transparent mt-4 opacity-70"></div>
        </div>

    </main>

</body>
</html>
